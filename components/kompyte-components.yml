scope: >-
  Kompyte ships no SDK, no element/component library and no loader script. The one client-side
  distribution surface it does document is an IFRAME EMBED of a hosted battlecard view, pasted
  into whatever tool the sales team already lives in. It is a hosted/prebuilt surface, not a
  component library, and it is recorded here as exactly that — an authenticated hosted view
  addressed by URL, with no configuration API, no JavaScript hook and no events.
loader_libraries: []
families:
- family: Battlecards embed
  kind: hosted-iframe
  description: >-
    A Kompyte-hosted battlecard view embedded in a third-party surface via a plain HTML iframe.
    Kompyte publishes the embed markup in its help center; sizing is done with the standard
    iframe width/height attributes. There are no query parameters, callbacks or postMessage
    contract documented.
  embed_pattern: '<iframe src="https://phi.kompyte.pro/sales/battlecards/"></iframe>'
  host: phi.kompyte.pro
  auth: >-
    Session-based. The embedded view is served from the same authenticated application host as
    the Kompyte web app (phi.kompyte.pro), so a viewer must have a Kompyte session. No embed
    token, signed URL or public-share mode is documented. Probed anonymously on 2026-08-13:
    https://phi.kompyte.pro/sales/battlecards/ returned HTTP 404 (the single-page-app shell),
    confirming the embed target is not publicly reachable without a session.
  configuration:
