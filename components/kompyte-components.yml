gaps:
- >-
  No JavaScript SDK, web component, or npm/CDN-distributed loader — the npm registry returns zero
  results for "kompyte" and PyPI returns 404, so there is nothing to version or pin.
- >-
  No documented embed authentication (signed URL, embed token, JWT), so the embed cannot be
  shown to an unauthenticated viewer or to an agent.
