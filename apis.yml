aid: kompyte
name: Kompyte
description: Kompyte is a competitive intelligence and sales enablement platform, part of Semrush,
  that automates the tracking of competitors across their websites, pricing pages, product releases,
  content, ads, social channels and review sites. Captured changes are scored and summarized into
  AI-generated daily digests and continuously updated sales battlecards, so revenue teams can see
  what rivals changed and how to respond in live deals. Kompyte also supports win/loss capture and
  delivers intelligence into the tools sellers already use through CRM, chat, sales-enablement and
  file-storage integrations including Salesforce, HubSpot, Slack, Microsoft Teams, Highspot,
  Showpad, Trello, Google Drive and Microsoft OneDrive. Kompyte publishes no public developer API,
  developer portal or API documentation as of this profile.
