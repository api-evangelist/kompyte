aid: kompyte
name: Kompyte
description: Kompyte is a competitive intelligence and sales enablement platform sold as a Semrush
  product, and Adobe-owned since Adobe completed its acquisition of Semrush on 28 April 2026. It
  automates the tracking of competitors across their websites, pricing pages, product releases,
  content, ads, social channels and review sites. Captured changes are scored and summarized into
  AI-generated daily digests and continuously updated sales battlecards, so revenue teams can see
  what rivals changed and how to respond in live deals. Kompyte also supports win/loss capture and
  delivers intelligence into the tools sellers already use through CRM, chat, sales-enablement and
  file-storage integrations including Salesforce, HubSpot, Slack, Microsoft Teams, Highspot,
  Showpad, Guru, Gong, Trello, Google Drive and Microsoft OneDrive, and lets teams embed a hosted
  battlecard view into those tools with an iframe. Kompyte sells three contact-sales tiers with
  published product quotas and commits to a 99.9% uptime SLA, but publishes no public developer
  API, developer portal, API documentation, SDK, webhook catalog or agent surface; the application
  backend at phi.kompyte.pro/api/ answers HTTP 403 "LOGIN REQUIRED" to every anonymous request.
