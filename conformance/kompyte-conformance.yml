- id: saml2
  name: SAML 2.0 (SP-initiated SSO)
  conforms: true
  confidence: medium
  evidence: >-
    The Kompyte SSO help article instructs admins to share "IdP parameters" with IT and to
    "upload your metadata XML file", after which Kompyte issues a custom login URL — the SAML 2.0
    service-provider configuration shape. The article never names the protocol, so this is read
    from the artifact it asks for rather than from a stated claim. SSO is a paid capability
    listed only on the Unlimited tier.
  source: https://helpcenter.kompyte.pro/en/articles/5278290-how-to-enable-and-configure-sso-in-kompyte
- id: scim
  name: SCIM 2.0 user provisioning
  conforms: false
  confidence: high
  evidence: >-
    Answered directly in the SSO FAQ. Q: "What type of user provisioning is supported? SCIM,
    Just-in-time, etc.?" A: "Just-in-Time". Kompyte provisions users on first SSO login and does
    not implement SCIM. Deprovisioning is also non-standard — a deleted user's data is retained
    against a "deleted user" record and is not recovered if the user is re-provisioned.
  source: https://helpcenter.kompyte.pro/en/articles/5278290-how-to-enable-and-configure-sso-in-kompyte
